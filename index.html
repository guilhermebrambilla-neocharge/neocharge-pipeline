<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Pipeline de Vendas — NeoCharge</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #EEF5FB; color: #2D2D2D;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
  }
  .card {
    background: #fff; border: 1px solid #DCE8F0; border-radius: 14px;
    box-shadow: 0 8px 40px rgba(0,174,239,0.15);
    padding: 36px 32px; width: 100%; max-width: 380px; text-align: center;
  }
  .brand { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 4px; }
  .brand span { color: #00AEEF; }
  .sub { color: #6B8099; font-size: 13px; margin-bottom: 24px; }
  .lock { font-size: 34px; margin-bottom: 12px; }
  input {
    width: 100%; padding: 12px 14px; font-size: 15px;
    border: 1.5px solid #DCE8F0; border-radius: 9px; outline: none; margin-bottom: 12px;
    transition: border-color .15s;
  }
  input:focus { border-color: #00AEEF; }
  button {
    width: 100%; padding: 12px; font-size: 15px; font-weight: 700; color: #fff;
    background: #00AEEF; border: none; border-radius: 9px; cursor: pointer;
    transition: background .15s;
  }
  button:hover { background: #0093CC; }
  button:disabled { background: #9FD4EC; cursor: default; }
  .err { color: #D6455D; font-size: 13px; min-height: 18px; margin-top: 10px; }
  .foot { color: #9FB2C4; font-size: 11px; margin-top: 18px; }
</style>
</head>

    <input type="password" id="pw" placeholder="Digite a senha" autofocus autocomplete="current-password">
    <button type="submit" id="btn">Entrar</button>
    <div class="err" id="err"></div>
    <div class="foot">Conteúdo criptografado ponta a ponta (AES-256).</div>
  </form>

const ITER     = 250000;
const SS_KEY   = "nc_pipeline_pw";

function b64ToBytes(b64) {
  const bin = atob(b64);
  const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return arr;
}

async function deriveKey(password, salt) {
  const baseKey = await crypto.subtle.importKey(
    "raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: salt, iterations: ITER, hash: "SHA-256" },
    baseKey, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
}

async function decryptWith(password) {
  const key = await deriveKey(password, b64ToBytes(SALT_B64));
  const plain = await crypto.subtle.decrypt(
    { name: "AES-GCM", iv: b64ToBytes(IV_B64) }, key, b64ToBytes(CT_B64));
  return new TextDecoder().decode(plain);
}

function reveal(html) {
  document.open();
  document.write(html);
  document.close();
  // Alguns navegadores não re-disparam o evento 'load' após document.write.
  // O pipeline inicializa em window.onload, então garantimos o boot manualmente.
  // (renderBoard é idempotente; se o 'load' também disparar, apenas re-renderiza.)
  setTimeout(function () {
    try { if (typeof window.onload === "function") window.onload(); } catch (e) {}
  }, 0);
}

const form = document.getElementById("gate");
const pwInput = document.getElementById("pw");
const btn = document.getElementById("btn");
const err = document.getElementById("err");

async function attempt(password, fromCache) {
  btn.disabled = true; err.textContent = "";
  try {
    const html = await decryptWith(password);
    try { sessionStorage.setItem(SS_KEY, password); } catch (e) {}
    reveal(html);
  } catch (e) {
    btn.disabled = false;
    if (!fromCache) { err.textContent = "Senha incorreta."; pwInput.select(); }
  }
}

form.addEventListener("submit", (e) => { e.preventDefault(); attempt(pwInput.value, false); });

// Se já entrou nesta aba, não pede a senha de novo.
(function () {
  let cached = null;
  try { cached = sessionStorage.getItem(SS_KEY); } catch (e) {}
  if (cached) attempt(cached, true);
})();
</script>
