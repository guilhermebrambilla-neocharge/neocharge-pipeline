<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>NeoCharge — Acesso restrito</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #EEF5FB; color: #2D2D2D;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  .card {
    background: #fff; border: 1px solid #DCE8F0; border-radius: 14px;
    box-shadow: 0 8px 40px rgba(0,174,239,0.15);
    padding: 36px 32px; width: 100%; max-width: 380px; text-align: center;
  }
  .brand { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 4px; }
  .brand span { color: #00AEEF; }
  .sub { color: #6B8099; font-size: 13px; margin-bottom: 24px; }
  .lock { font-size: 34px; margin-bottom: 12px; }
  input {
    width: 100%; padding: 12px 14px; font-size: 15px;
    border: 1.5px solid #DCE8F0; border-radius: 9px; outline: none; margin-bottom: 12px;
    transition: border-color .15s;
  }
  input:focus { border-color: #00AEEF; }
  button {
    width: 100%; padding: 12px; font-size: 15px; font-weight: 700; color: #fff;
    background: #00AEEF; border: none; border-radius: 9px; cursor: pointer;
    transition: background .15s;
  }
  button:hover { background: #0093CC; }
  button:disabled { background: #9FD4EC; cursor: default; }
  .err { color: #D6455D; font-size: 13px; min-height: 18px; margin-top: 10px; }
  .foot { color: #9FB2C4; font-size: 11px; margin-top: 18px; }
  .choices { display: flex; flex-direction: column; gap: 12px; margin-top: 8px; }
  .choice {
    display: flex; align-items: center; gap: 14px; text-align: left;
    width: 100%; padding: 16px; font-size: 15px; font-weight: 700; color: #1B2733;
    background: #F5FAFD; border: 1.5px solid #DCE8F0; border-radius: 11px; cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .choice:hover { border-color: #00AEEF; background: #EAF7FD; }
  .choice .ico { font-size: 24px; flex-shrink: 0; }
  .choice .txt { display: flex; flex-direction: column; gap: 2px; }
  .choice .txt small { font-weight: 400; color: #6B8099; font-size: 12px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <form class="card" id="gate" autocomplete="off">
    <div class="lock">🔒</div>
    <div class="brand">NEO<span>CHARGE</span></div>
    <div class="sub">Acesso restrito ao time</div>
    <input type="password" id="pw" placeholder="Digite a senha" autofocus autocomplete="current-password">
    <button type="submit" id="btn">Entrar</button>
    <div class="err" id="err"></div>
    <div class="foot">Conteúdo criptografado ponta a ponta (AES-256).</div>
  </form>

  <div class="card" id="chooser" hidden>
    <div class="brand">NEO<span>CHARGE</span></div>
    <div class="sub">O que você quer ver?</div>
    <div class="choices">
      <button type="button" class="choice" id="goPipeline">
        <span class="ico">📋</span>
        <span class="txt">Pipeline de Vendas<small>Kanban completo, negócios em andamento</small></span>
      </button>
      <button type="button" class="choice" id="goDashboard">
        <span class="ico">📊</span>
        <span class="txt">Dashboard Executivo<small>Funil, metas 1MW, carregadores ativos</small></span>
      </button>
    </div>
    <div class="foot">Recarregue a página pra trocar de visão depois.</div>
  </div>

const ITER   = 250000;
const SS_KEY = "nc_pipeline_pw";

function b64ToBytes(b64) {
  const bin = atob(b64);
  const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return arr;
}

async function deriveKey(password, salt) {
  const baseKey = await crypto.subtle.importKey(
    "raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: salt, iterations: ITER, hash: "SHA-256" },
    baseKey, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
}

async function decryptDoc(password, doc) {
  const key = await deriveKey(password, b64ToBytes(doc.salt));
  const plain = await crypto.subtle.decrypt(
    { name: "AES-GCM", iv: b64ToBytes(doc.iv) }, key, b64ToBytes(doc.ct));
  return new TextDecoder().decode(plain);
}

function reveal(html) {
  document.open();
  document.write(html);
  document.close();
  // Alguns navegadores não re-disparam o evento 'load' após document.write.
  // As páginas inicializam em window.onload, então garantimos o boot manualmente.
  // (a inicialização é idempotente; se o 'load' também disparar, apenas re-renderiza.)
  setTimeout(function () {
    try { if (typeof window.onload === "function") window.onload(); } catch (e) {}
  }, 0);
}

const gate = document.getElementById("gate");
const chooser = document.getElementById("chooser");
const pwInput = document.getElementById("pw");
const btn = document.getElementById("btn");
const err = document.getElementById("err");

let cachedHtml = { pipeline: null, dashboard: null };
let currentPassword = null;

function showChooser() {
  gate.hidden = true;
  chooser.hidden = false;
}

async function openDoc(name) {
  const target = document.getElementById(name === "pipeline" ? "goPipeline" : "goDashboard");
  target.disabled = true;
  try {
    if (!cachedHtml[name]) {
      cachedHtml[name] = await decryptDoc(currentPassword, DOCS[name]);
    }
    reveal(cachedHtml[name]);
  } catch (e) {
    target.disabled = false;
    alert("Não foi possível abrir esse conteúdo. Tente recarregar a página.");
  }
}

function wantedDoc() {
  // Suporta index.html?open=pipeline ou ?open=dashboard — usado pelo botão
  // "Ver pipeline completo" de dentro do dashboard, pra pular a tela de
  // escolha e ir direto (com a senha já em cache na aba).
  const p = new URLSearchParams(location.search).get("open");
  return (p === "pipeline" || p === "dashboard") ? p : null;
}

async function attempt(password, fromCache) {
  btn.disabled = true; err.textContent = "";
  try {
    // Usa o pipeline pra validar a senha (os dois foram cifrados com a mesma senha).
    const html = await decryptDoc(password, DOCS.pipeline);
    cachedHtml.pipeline = html;
    currentPassword = password;
    try { sessionStorage.setItem(SS_KEY, password); } catch (e) {}
    showChooser();
    const wanted = wantedDoc();
    if (wanted) openDoc(wanted);
  } catch (e) {
    btn.disabled = false;
    if (!fromCache) { err.textContent = "Senha incorreta."; pwInput.select(); }
  }
}

gate.addEventListener("submit", (e) => { e.preventDefault(); attempt(pwInput.value, false); });
document.getElementById("goPipeline").addEventListener("click", () => openDoc("pipeline"));
document.getElementById("goDashboard").addEventListener("click", () => openDoc("dashboard"));

// Se já entrou nesta aba, não pede a senha de novo — vai direto pra escolha.
(function () {
  let cached = null;
